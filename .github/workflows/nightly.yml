name: CALLIOPE nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  # Manual trigger for ad-hoc runs via
  # ``gh workflow run "CALLIOPE nightly" -r <branch>``.
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents.
# Coverage upload uses the CODECOV_TOKEN secret directly, not the
# default GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: full test suite (unit + smoke + integration + slow) with
# coverage instrumentation. The PR gate runs only the unit + smoke
# tiers; the integration and slow tiers run real solver invocations
# that exercise the full hybrid `equilibrium_atmosphere` solver.
# Coverage is reported to the Codecov dashboard via codecov-action.
jobs:
  nightly:
    name: CALLIOPE-nightly (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CALLIOPE and pytest
        run: |
          python -m pip install --upgrade pip
          pip install ".[develop]"
          pip install pytest-cov

      - name: Run unit + smoke + integration + slow tests with coverage
        run: |
          pytest -m "(unit or smoke or integration or slow) and not skip" \
            --cov=src/calliope \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/CALLIOPE
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false

name: CALLIOPE nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  # Manual trigger for ad-hoc runs via
  # ``gh workflow run "CALLIOPE nightly" -r <branch>``.
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents.
# Coverage upload uses the CODECOV_TOKEN secret directly, not the
# default GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: full test suite (unit + smoke + integration + slow) with
# coverage instrumentation. The PR gate runs only the unit + smoke
# tiers; the integration and slow tiers run real solver invocations
# that exercise the full hybrid `equilibrium_atmosphere` solver.
# Coverage is reported to the Codecov dashboard via codecov-action.
jobs:
  nightly:
    name: CALLIOPE-nightly (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install CALLIOPE and atmodeller
        run: |
          python -m pip install --upgrade pip
          pip install ".[develop]" "atmodeller @ git+https://github.com/FormingWorlds/atmodeller.git@main"

      - name: Run unit + smoke + integration + slow tests with coverage
        env:
          CHEM_CROSS_CODE_REQUIRED: '1'
          CHEM_SULFUR_REPORT_PATH: sulfur_72_case_report.tsv
        run: |
          pytest -m "(unit or smoke or integration or slow) and not skip" \
            --cov=calliope \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload 72-case sulfur report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: calliope-atmodeller-sulfur-72-case-report
          path: sulfur_72_case_report.tsv
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/CALLIOPE
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false

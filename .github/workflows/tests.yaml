name: CALLIOPE CI Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

# Push and PR CI: unit + smoke tiers only, on ubuntu + macos x py 3.11/3.12/3.13.
# Targets <10 min wall. The integration and slow tiers run real
# multi-species CHNS solves and live in the scheduled nightly workflow
# `nightly.yml` instead.

permissions:
  contents: read
  # actions:read enables `gh run download` to fetch the previous
  # nightly's coverage artifact for the union estimation step.
  actions: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: CALLIOPE-check (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        python-version: ['3.12', '3.13']

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        id: cache-virtualenv
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[develop]"
          python -m pip install pytest-cov

      - name: Validate test markers
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: bash tools/validate_test_structure.sh

      - name: Pre-flight fail_under ratchet check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Reject PRs that lower [tool.coverage.report] fail_under
          # below the value on the base branch. The 95% ceiling is the
          # maximum ratchet per ecosystem policy; this check enforces
          # the one-way-only direction (down forbidden) so the gate
          # cannot be weakened to land an under-tested change.
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          base_ref = os.environ.get('BASE_REF', 'main')
          out = subprocess.run(
              ['git', 'show', f'origin/{base_ref}:pyproject.toml'],
              capture_output=True,
              text=True,
              check=False,
          )
          if out.returncode != 0:
              print(f'Could not read pyproject.toml from origin/{base_ref}; skipping check.')
              sys.exit(0)

          base = tomllib.loads(out.stdout)
          head = tomllib.loads(pathlib.Path('pyproject.toml').read_text())

          def fail_under(d):
              try:
                  return float(d['tool']['coverage']['report']['fail_under'])
              except KeyError:
                  return None

          base_v = fail_under(base)
          head_v = fail_under(head)
          print(f'fail_under: base={base_v} head={head_v}')

          # Base has no [tool.coverage.report].fail_under: nothing to
          # ratchet against. The first PR that introduces the gate is
          # allowed regardless of head_v.
          if base_v is None:
              print(
                  f'origin/{base_ref} has no [tool.coverage.report].fail_under; '
                  'no ratchet to enforce. PASS.'
              )
              sys.exit(0)

          # Head removed the gate that base had: that is a decrease.
          if head_v is None:
              print(
                  f'ERROR: head removed [tool.coverage.report].fail_under '
                  f'(base had {base_v}). The gate is one-way only.'
              )
              sys.exit(1)

          if head_v < base_v:
              print(
                  f'ERROR: fail_under decreased ({head_v} < {base_v}). '
                  'The coverage gate is one-way only; ask a maintainer if a '
                  'downward adjustment is required.'
              )
              sys.exit(1)
          print('OK: fail_under is non-decreasing.')
          PY

      - name: Run unit + smoke tests
        env:
          # Coverage instrumentation slows pytest. The Codecov upload
          # and union-estimation steps below only run on the
          # ubuntu + py3.12 cell, so the other five matrix cells gain
          # nothing from emitting coverage. Gate --cov flags to that
          # one cell. --cov-fail-under=0 overrides the 95% floor in
          # pyproject.toml for this tier (PR gate runs only unit + smoke,
          # which does not exercise the integration tier; the canonical
          # 95% gate is enforced in nightly.yml on the full suite).
          COV_FLAGS: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '--cov=src/calliope --cov-report=xml --cov-report=json:coverage.json --cov-fail-under=0' || '' }}
        run: |
          pytest -m "(unit or smoke) and not skip" $COV_FLAGS

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/CALLIOPE
          files: coverage.xml
          flags: ci
          fail_ci_if_error: false

      - name: Download last nightly coverage artifact
        id: download-nightly
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First-party-only path to cross-workflow artifact download:
          # query the latest successful nightly run on main, then use
          # `gh run download`. Failures here do not break the PR (the
          # union step downgrades to "nightly missing" warning).
          set +e
          mkdir -p nightly-coverage
          RUN_ID=$(gh run list \
              --workflow=nightly.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId' \
              -R ${{ github.repository }})
          if [ -z "$RUN_ID" ]; then
            echo "No successful nightly run found on main."
            echo "nightly_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading artifact from nightly run $RUN_ID"
          gh run download "$RUN_ID" \
              --name nightly-coverage \
              --dir nightly-coverage \
              -R ${{ github.repository }}
          if [ ! -f nightly-coverage/coverage.json ]; then
            echo "Artifact missing coverage.json; treating as missing."
            echo "nightly_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "nightly_missing=false" >> "$GITHUB_OUTPUT"
          echo "nightly_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Estimate combined coverage union
        id: coverage-union
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        env:
          NIGHTLY_MISSING: ${{ steps.download-nightly.outputs.nightly_missing }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib
          from datetime import datetime, timezone

          GRACE_PERIOD = 0.3  # percent; coverage drops below this do not block
          STALE_HOURS = 48

          def read_totals(path):
              try:
                  with open(path) as fh:
                      data = json.load(fh)
                  t = data.get('totals', {})
                  return (
                      t.get('percent_covered', 0.0),
                      t.get('covered_lines', 0),
                      t.get('num_statements', 0),
                  )
              except Exception:
                  return 0.0, 0, 0

          def norm_path(p):
              p = p.replace('\\', '/')
              if 'src/' in p:
                  return p.split('src/', 1)[-1]
              return p

          def line_set_executed(data):
              out = set()
              for path, fd in data.get('files', {}).items():
                  n = norm_path(path)
                  for line in fd.get('executed_lines', []) or []:
                      out.add((n, line))
              return out

          def line_set_executable(data):
              out = set()
              for path, fd in data.get('files', {}).items():
                  n = norm_path(path)
                  exec_ = fd.get('executed_lines', []) or []
                  miss_ = fd.get('missing_lines', []) or []
                  for line in exec_ + miss_:
                      out.add((n, line))
              return out

          # Threshold: source of truth is pyproject.toml.
          full_threshold = 95.0
          try:
              data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
              full_threshold = float(
                  data['tool']['coverage']['report']['fail_under']
              )
          except Exception as exc:
              print(f'WARN: could not read fail_under from pyproject.toml: {exc}')

          # Unit + smoke tier coverage from this PR.
          u_pct, u_covered, u_total = read_totals('coverage.json')
          u_data = {}
          if pathlib.Path('coverage.json').exists():
              try:
                  u_data = json.loads(pathlib.Path('coverage.json').read_text())
              except Exception:
                  pass

          # Nightly full-suite coverage.
          n_path = pathlib.Path('nightly-coverage/coverage.json')
          n_pct, n_covered, n_total = read_totals(n_path)
          n_data = {}
          if n_path.exists():
              try:
                  n_data = json.loads(n_path.read_text())
              except Exception:
                  pass

          # Staleness check.
          ts_path = pathlib.Path('nightly-coverage/nightly-timestamp.txt')
          stale = False
          stale_hours = None
          if ts_path.exists():
              try:
                  ts_str = ts_path.read_text().strip().replace('Z', '+00:00')
                  ts = datetime.fromisoformat(ts_str)
                  age = datetime.now(timezone.utc) - ts
                  stale_hours = age.total_seconds() / 3600.0
                  stale = stale_hours > STALE_HOURS
              except Exception:
                  pass

          missing = os.environ.get('NIGHTLY_MISSING', 'false') == 'true'
          missing = missing or not n_data

          # Union estimate.
          est_pct = None
          est_covered = 0
          est_total = 0
          if u_data.get('files') and n_data.get('files'):
              union_exec = line_set_executed(u_data) | line_set_executed(n_data)
              union_all = line_set_executable(u_data) | line_set_executable(n_data)
              if union_all:
                  est_covered = len(union_exec)
                  est_total = len(union_all)
                  est_pct = min(100.0, 100.0 * est_covered / est_total)

          # Status: ok / warn / fail relative to full threshold + grace.
          status = 'ok'
          drop = 0.0
          if est_pct is not None:
              drop = full_threshold - est_pct
              if drop > GRACE_PERIOD:
                  status = 'fail'
              elif drop > 0:
                  status = 'warn'

          summary_lines = [
              '## Coverage estimate (PR vs nightly union)',
              '',
              f'- Unit + smoke (this PR): **{u_pct:.2f}%** ({u_covered}/{u_total} stmts)',
          ]
          if missing:
              summary_lines.append('- Nightly artifact: **MISSING** (no successful nightly on main)')
          else:
              age_str = f' ({stale_hours:.1f}h old)' if stale_hours is not None else ''
              tag = ' [STALE]' if stale else ''
              summary_lines.append(
                  f'- Nightly: **{n_pct:.2f}%** ({n_covered}/{n_total}){age_str}{tag}'
              )
          if est_pct is not None:
              summary_lines.append(
                  f'- Estimated union: **{est_pct:.2f}%** ({est_covered}/{est_total})'
              )
              summary_lines.append(f'- Threshold: {full_threshold:.2f}% | drop: {drop:+.2f}% | status: **{status}**')
          else:
              summary_lines.append('- Union estimate unavailable (one or both JSONs missing).')
          if missing or stale:
              summary_lines.append('')
              summary_lines.append('> Nightly missing or stale; union number is informational only and does not gate this PR.')

          summary_md = '\n'.join(summary_lines) + '\n'
          print(summary_md)
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a') as fh:
                  fh.write(summary_md)

          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a') as fh:
                  fh.write(f'unit_pct={u_pct:.2f}\n')
                  fh.write(f'nightly_pct={n_pct:.2f}\n')
                  fh.write(f'est_pct={est_pct:.2f}\n' if est_pct is not None else 'est_pct=\n')
                  fh.write(f'est_covered_union={est_covered}\n')
                  fh.write(f'est_total_union={est_total}\n')
                  fh.write(f'coverage_status={status}\n')
                  fh.write(f'coverage_drop={drop:.2f}\n')
                  fh.write(f'nightly_stale={"true" if stale else "false"}\n')
                  fh.write(f'nightly_missing={"true" if missing else "false"}\n')

          # Informational only; never fails the job.
          PY

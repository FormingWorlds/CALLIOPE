# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The vendored SIL Open Font License text is redistributed verbatim
      # alongside the fonts, so the two rewriting hooks leave it alone.
      # A test asserts that every exclude in this file matches a tracked file.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^docs/stylesheets/fonts/OFL\.txt$
      - id: end-of-file-fixer
        exclude: ^docs/stylesheets/fonts/OFL\.txt$
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-builtin-literals
      - id: check-ast
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      # - id: ruff-format
      #   types_or: [python, pyi]
  - repo: local
    hooks:
      - id: check-file-sizes
        name: Check copilot-instructions.md line limit
        entry: bash tools/check_file_sizes.sh
        language: system
        files: \.github/copilot-instructions\.md$
        pass_filenames: false

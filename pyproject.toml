[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "fwl-calliope"
dynamic = ["version"]
description = "Planetary accretion and volatile delivery model"
readme = "README.md"
requires-python = ">=3.12"
authors = [
	{name = "Harrison Nicholls", email = "h-nicholls@pm.me"},
	{name = "Tim Lichtenberg", email = "tim.lichtenberg@rug.nl"},
]
keywords = [
    "Astronomy",
    "Exoplanets",
    "Model-coupling",
]
license = {text = "Apache 2.0 License"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "cmcrameri"
]

[project.urls]
homepage = "https://github.com/FormingWorlds/CALLIOPE"
issues = "https://github.com/FormingWorlds/CALLIOPE/issues"
documentation = "https://proteus-framework.org/CALLIOPE/"
changelog = "https://github.com/FormingWorlds/CALLIOPE/releases"

[project.optional-dependencies]
develop = [
    "coverage",
    "hypothesis >= 6.0",
    "pip-tools",
    "pytest >= 8.1",
    "pytest-cov",
    "pre-commit",
    "pyyaml",
    "ruff",
]

docs = [
    "zensical",
    "markdown-include",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

# [project.scripts]
# proteus = "proteus.cli:cli"

[tool.setuptools]
package-dir = {"calliope" = "src/calliope" }
include-package-data = true

[tool.setuptools_scm]
# CalVer: tags are bare YY.MM.DD dates (no leading 'v', e.g. 26.05.10).
# setuptools-scm derives the version from the latest git tag.
# version_scheme = "no-guess-dev" is required for CalVer: the default
# "guess-next-dev" would produce 26.5.11.devN+gHASH for commits after
# the 26.05.10 tag, claiming a future calendar date that will collide
# with the next daily release tag. "no-guess-dev" produces
# 26.05.10.post1.devN+gHASH instead, which is honest about the build
# being a post-tag development commit rather than a pre-release of
# the next version.
version_scheme = "no-guess-dev"
version_file = "src/calliope/_version.py"

[tool.coverage.run]
branch = true
source = ["calliope"]

[tool.coverage.report]
# Full coverage gate: unit + smoke + integration + slow tests, enforced by
# the nightly workflow. 90% is the PROTEUS-ecosystem ceiling: the gate does
# not rise above this value even if real coverage exceeds it. Above 90%
# the gate tracks pragma usage and style rather than bug-finding signal.
# Auto-ratcheted by tools/update_coverage_threshold.py; never manually
# decrease. See .github/.claude/rules/calliope-tests.md section 15.
fail_under = 90.0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.calliope.coverage_fast]
# Fast PR gate: unit + smoke coverage only, enforced on every PR via
# .github/workflows/tests.yaml. Capped at the 90% PROTEUS-ecosystem
# ceiling by tools/update_coverage_threshold.py. Measured unit+smoke
# coverage exceeds 90, so the gate sits at the ceiling. Never manually
# decrease. See .github/.claude/rules/calliope-tests.md section 15.
fail_under = 90.0

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-process unit tests (mocked physics, < 100 ms each)",
    "smoke: real-binary tests on minimal configurations (< 30 s each)",
    "integration: real-binary tests with full coupling",
    "slow: anything > 1 minute, run in nightly only",
    "physics_invariant: marks tests that assert a physical invariant (conservation, positivity, boundedness, monotonicity, symmetry). See .github/.claude/rules/calliope-tests.md section 3.",
    "reference_pinned: marks tests that pin behavior against a published benchmark, analytical limit, or cross-implementation cross-check. Cite the source in the test docstring. Each physics source must contain at least one. See .github/.claude/rules/calliope-tests.md section 3.",
]

[tool.ruff]
line-length = 96
target-version = "py312"
# _version.py is auto-generated by setuptools-scm at install/build time
# and lives under src/calliope/ (gitignored). Excluding it keeps
# `ruff format --check` from failing on whatever quote style
# setuptools-scm chooses to emit.
extend-exclude = ["*ipynb", "**/_version.py"]

[tool.ruff.lint]
select = [
	"F",  # Pyflakes
	"E",  # pycodestyle (error)
	"W",  # pycodestyle (warning)
    "I",    # isort
]
ignore = [
    "E501", # Line too long
]

[tool.ruff.lint.isort]
known-first-party=["calliope"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
